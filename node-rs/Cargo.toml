[package]
name = "node-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
prost = "0.14.4"
prost-types = "0.14.4"
sea-orm = { version = "2.0.2", features = ["entity-registry", "runtime-tokio-rustls", "schema-sync", "sqlx-postgres"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tonic = "0.14.6"
tonic-middleware = "0.4.1"
tonic-prost = "0.14.6"
uuid = "1.24.0"

[build-dependencies]
tonic-prost-build = "0.14.6"
