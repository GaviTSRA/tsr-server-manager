[package]
name = "node-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
bollard = { version = "0.21.1", features = ["buildkit", "chrono", "ssl", "websocket"] }
chrono = "0.4.45"
dotenvy = "0.15.7"
futures = "0.3.34"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
prost = "0.14.4"
prost-types = "0.14.4"
regex = "1.13.1"
reqwest = { version = "0.13.4", features = ["blocking"] }
rhai = { version = "1.25.1", features = ["serde", "sync"] }
sea-orm = { version = "2.0.2", features = ["entity-registry", "runtime-tokio-rustls", "schema-sync", "sqlx-postgres"] }
serde = "1.0.229"
serde_json = "1.0.151"
tar = "0.4.46"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tonic = "0.14.6"
tonic-middleware = "0.4.1"
tonic-prost = "0.14.6"
uuid = { version = "1.24.0", features = ["v4"] }
xz2 = "0.1.7"

[build-dependencies]
tonic-prost-build = "0.14.6"

[profile.dev]
debug = "line-tables-only"
