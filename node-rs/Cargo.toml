[package]
name = "node-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }
prost = "0.14.4"
prost-types = "0.14.4"
serde = "1.0.229"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }
tonic = "0.14.6"
tonic-middleware = "0.4.1"
tonic-prost = "0.14.6"

[build-dependencies]
tonic-prost-build = "0.14.6"
