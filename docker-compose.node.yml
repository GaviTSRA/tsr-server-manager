services:
  db:
    image: postgres:16.4
    restart: always
    ports:
      - 5433:5432/tcp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tsm-node
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./node-postgres-data:/var/lib/postgresql/data
  db2:
    image: postgres:16.4
    restart: always
    ports:
      - 5434:5432/tcp
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tsm-node
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./node-postgres-data2:/var/lib/postgresql/data
  server:
    restart: always
    build:
      context: ./
      dockerfile: ./node/Dockerfile
    environment:
      - DOCKER_HOST=tcp://host.docker.internal:2375
      - DB_HOST=db
    extra_hosts:
    - "host.docker.internal:host-gateway"
    ports:
      - 8771:8771/tcp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace
      - /workspace/client
      - /workspace/server
